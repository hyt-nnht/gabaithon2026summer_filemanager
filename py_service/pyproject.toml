[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-analyzer"
version = "0.1.0"
description = "Local text extraction and SLM analysis service for File Organizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pypdf>=5,<7",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
ocr = [
    "onnxruntime>=1.19,<2",
    "pypdfium2>=4.30,<6",
    "rapidocr>=3,<4",
]
slm = [
    "huggingface-hub>=0.28,<2",
    "llama-cpp-python>=0.3,<1",
]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
